name: Auto IP Roller

on:
  schedule:
    # Запуск каждые 3 часа
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  roll_ips:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Скачиваем код
        uses: actions/checkout@v5

      - name: Устанавливаем библиотеку requests
        run: pip install requests

      - name: Крутим Selectel
        env:
          ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          SEL_USERNAME: ${{ secrets.SEL_USERNAME }}
          SEL_PASSWORD: ${{ secrets.SEL_PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python -u selectel.py
