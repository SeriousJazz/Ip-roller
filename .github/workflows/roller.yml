name: Auto IP Roller

on:
  schedule:
    # Запуск каждые 3 часа (00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00)
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  roll_ips:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Скачиваем код
        uses: actions/checkout@v5

      - name: Устанавливаем библиотеку requests
        run: pip install requests

      - name: Крутим Selectel
        run: python -u selectel.py

      # Если добавил файл timeweb.py, просто убери решетки (#) со следующих двух строчек:
      # - name: Крутим Timeweb
      #   run: python -u timeweb.py
