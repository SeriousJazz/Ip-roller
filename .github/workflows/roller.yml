name: Auto IP Roller

on:
  schedule:
    # Запуск в 09:00 и 21:00 по Москве (06:00 и 18:00 UTC)
    - cron: '0 6,18 * * *'
    # Запуск в 13:30 и 17:30 по Москве (10:30 и 14:30 UTC)
    - cron: '30 10,14 * * *'
  workflow_dispatch: # Кнопка для ручного запуска в любой момент

jobs:
  roll_ips:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Скачиваем код
        uses: actions/checkout@v4

      - name: Устанавливаем библиотеку requests
        run: pip install requests

      - name: Крутим Selectel
        run: python -u selectel.py

      # Если добавил файл timeweb.py, просто убери решетки (#) со следующих двух строчек:
      # - name: Крутим Timeweb
      #   run: python -u timeweb.py
